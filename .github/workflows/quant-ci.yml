name: Penguin Quant CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript Lint & Compile
        run: bun run lint
      - name: Vite Production Build
        run: bun run build
  quant-service-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Quant Service Dependencies
        working-directory: quant-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify Service Imports
        working-directory: quant-service
        env:
          QUANT_SERVICE_TOKEN: "ci_test_token_000000000000000000"
        run: |
          python -c "import app.main; print('FastAPI App initialized successfully')"
