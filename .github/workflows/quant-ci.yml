name: AetherQuant CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: TypeScript Lint & Compile
        run: npm run lint
      - name: Vite Production Build
        run: npm run build

  quant-service-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Quant Service Dependencies
        working-directory: quant-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify Service Imports
        working-directory: quant-service
        env:
          QUANT_SERVICE_TOKEN: "ci_test_token_000000000000000000"
        run: |
          python -c "import app.main; print('FastAPI App initialized successfully')"
